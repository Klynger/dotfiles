# Tools the yazi config depends on, checked by scripts/check_requirements.sh
# before symlinking. Most are optional previewers yazi picks up when present,
# but install_yazi.sh installs them all so the experience matches between
# machines.
#
# tool | minimum version (empty = presence only) | how to install
yazi | 26.1.0 | brew install yazi
fzf | | brew install fzf
fd | | brew install fd
rg | | brew install ripgrep
zoxide | | brew install zoxide
jq | | brew install jq
ffmpeg | | brew install ffmpeg
7zz | | brew install sevenzip
pdftoppm | | brew install poppler
resvg | | brew install resvg
magick | | brew install imagemagick
mpv | | brew install mpv
