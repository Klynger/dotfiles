# Tokyo Night status line, sourced by .tmux.conf through ~/.config/current-theme
set -g status-style "bg=default,fg=#c0caf5"
set -g status-left "#[fg=#16161e,bg=#7aa2f7,bold]  #S #[fg=#7aa2f7,bg=default] "
set -g status-right "#[fg=#787fa5]CPU #{cpu_percentage} #{battery_percentage}  #[fg=#c0caf5,bold]%H:%M "
set -g window-status-format "#[fg=#787fa5] #I #W "
set -g window-status-current-format "#[fg=#7aa2f7,bold] #I #W "
set -g pane-border-style "fg=#292e42"
set -g pane-active-border-style "fg=#7aa2f7"
set -g message-style "bg=#292e42,fg=#c0caf5"
set -g mode-style "bg=#292e42,fg=#7aa2f7"
