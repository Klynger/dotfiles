unbind r
bind r source-file ~/.tmux.conf

unbind C-b
set -g prefix C-s 
bind-key C-s send-prefix

set -g mouse on

set -g default-terminal "tmux-256color"
set-option -as terminal-features ",*:RGB"
set -g base-index 1

unbind z
bind m resize-pane -Z

bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

set-window-option -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel

# copy-pipe uses copy-command, which depends on the OS clipboard tool
if-shell 'uname | grep -q Darwin' \
    "set -s copy-command 'pbcopy'" \
    "set -s copy-command 'xclip -in -selection clipboard'"

set-option -g status-position top

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'christoomey/vim-tmux-navigator'

# For images https://github.com/3rd/image.nvim
set -gq allow-passthrough on
set -g visual-activity off

# Tokyo Night status line, hand-rolled: the same palette as Neovim and the
# Linux shell theme, shared by both machines with no theme plugin
set -g status-right-length 100
set -g status-left-length 100
set -g status-style "bg=default,fg=#c0caf5"
set -g status-left "#[fg=#16161e,bg=#7aa2f7,bold]  #S #[fg=#7aa2f7,bg=default] "
set -g status-right "#[fg=#787fa5]CPU #{cpu_percentage} #{battery_percentage}  #[fg=#c0caf5,bold]%H:%M "
set -g window-status-format "#[fg=#787fa5] #I #W "
set -g window-status-current-format "#[fg=#7aa2f7,bold] #I #W "
set -g window-status-separator ""
set -g pane-border-style "fg=#292e42"
set -g pane-active-border-style "fg=#7aa2f7"
set -g message-style "bg=#292e42,fg=#c0caf5"
set -g mode-style "bg=#292e42,fg=#7aa2f7"

# Plugins live next to tpm in the dotfiles repo (gitignored) instead of the
# tpm default ~/.tmux/plugins
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.config/tmux/plugins/"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.config/tmux/plugins/tpm/tpm'

