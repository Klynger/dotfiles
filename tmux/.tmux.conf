unbind r
bind r source-file ~/.tmux.conf

unbind C-b
set -g prefix C-s 
bind-key C-s send-prefix

set -g mouse on

set -g default-terminal "tmux-256color"
set-option -as terminal-features ",*:RGB"
set -g base-index 1

unbind z
bind m resize-pane -Z

bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

set-window-option -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel

# copy-pipe uses copy-command, which depends on the OS clipboard tool
if-shell 'uname | grep -q Darwin' \
    "set -s copy-command 'pbcopy'" \
    "set -s copy-command 'xclip -in -selection clipboard'"

set-option -g status-position top

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'christoomey/vim-tmux-navigator'

# For images https://github.com/3rd/image.nvim
set -gq allow-passthrough on
set -g visual-activity off

# Status line colors come from the current theme: switch-theme repoints
# ~/.config/current-theme on Linux, and on macOS the symlink is created
# by scripts/symlinks.sh (or by hand to any dir under themes/). The -q
# keeps a machine without the symlink on tmux defaults instead of failing.
set -g status-right-length 100
set -g status-left-length 100
set -g window-status-separator ""
source-file -q ~/.config/current-theme/tmux.conf

# Plugins live next to tpm in the dotfiles repo (gitignored) instead of the
# tpm default ~/.tmux/plugins
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.config/tmux/plugins/"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.config/tmux/plugins/tpm/tpm'

